    put:
      tags: [Communication Permissions]
      description: Updates the communication permissions of permission value
      summary: Updates the communication permissions of permission value
      operationId: updateCommunicationPermissions
      security:
        - Oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permission
                - update_date
              properties:
                permission:
                  type: boolean
                  description: communication permitted or not
                update_date:
                  type: string
                  format: date-time
                  description: value last update date
                details:
                  type: string
                  description: additional details like channel, IP address etc.
      responses:
        200:
          description: Permission Updated
          content:
            application/json:
              schema:
