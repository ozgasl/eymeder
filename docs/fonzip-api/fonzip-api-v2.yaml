  /donations:
    get:
      tags: [Donations]
      description: List Donations
      summary: List Donations
      operationId: getDonationList
      security:
        - Oauth: []
      parameters:
        - name: status
          in: query
          description: what kind of donations should be listed
          required: true
          schema:
            type: string
            default: paid
            enum:
              - paid
              - refund
              - failed
        - name: list
          in: query
          description: which values should be listed
          schema:
            type: array
            items:
              type: string
              description: field names
              enum:
                - details
                - name_surname
                - address
                - amount
                - sub_donation_type
                - birthday
                - email_status
                - complete_date
                - fundraising_campaign
                - tckno
                - tax_department
                - phone
                - donation_page
                - module
                - payment_method
                - added_by_id
                - f2f_group_id
                - fonzip_id
                - recurring_order_id
                - recurring_withdraw_count
                - recurring_total_withdraw_count
                - recurring_total_withdraw_amount
                - transaction_id
                - provision_no
                - auth_code
                - reference_id
                - ip_address
                - fundraising_campaign_user
                - api_tracking_id
                - news_via_phone
                - news_via_sms
                - news_via_email
                - application
                - card_number
                - receipt_no
                - donor_type
                - amount_visible
                - name_hidden
                - message
                - show_message
                - referring_name
                - referring_email
                - referring_phone
                - bank_account__name
                - payment_settings__name
                - recurring_cancel_reason
                - recurring_cancel_date
                - recurring_start_date
                - recurring_stop_date
                - cancelled_by_id
                - marketing_channel__utm_source
                - marketing_channel__utm_medium
                - marketing_channel__utm_campaign
                - marketing_channel__utm_content
        - name: category_id
          in: query
          description: donation category id, null for all
          schema:
            type: integer
            default: null
        - name: no_category
          in: query
          description: when true, return only donations that have no donation category assigned. Ignored if category_id is also supplied.
          schema:
            type: boolean
            default: null
        - name: donation_page
          in: query
          description: donation page id
          schema:
            type: integer
        - name: fundraising_campaign
          in: query
          description: fundraising campaign id
          schema:
            type: integer
        - name: association_campaign_target
          in: query
          description: fundraising event id
          schema:
            type: integer
        - name: payment_settings_id
          in: query
          description: payment settings id
          schema:
            type: integer
        - name: bank_account_id
          in: query
          description: bank account id
          schema:
            type: integer
        - name: utm_source
          in: query
          description: |
            Filter donations whose marketing channel `utm_source` matches one of
            the supplied values (IN-list). Repeat the parameter to supply
            multiple values, e.g. `?utm_source=google&utm_source=bing`.
          schema:
            type: array
            items:
              type: string
        - name: utm_medium
          in: query
          description: Filter donations by one or more `utm_medium` values (IN-list).
          schema:
            type: array
            items:
              type: string
        - name: utm_campaign
          in: query
          description: Filter donations by one or more `utm_campaign` values (IN-list).
          schema:
            type: array
            items:
              type: string
        - name: utm_content
          in: query
          description: Filter donations by one or more `utm_content` values (IN-list).
          schema:
            type: array
            items:
              type: string
        - name: marketing_channel_null
          in: query
          description: |
            When true, return only donations with no marketing channel attached
            (organic / direct traffic). Mutually exclusive with the four UTM
            filters above — when set, those are ignored.
          schema:
            type: boolean
            default: null
        - name: api_tracking_id
          in: query
          description: API Tracking ID
          schema:
            type: string
        - name: order_by
          in: query
          description: ordering
          schema:
            type: string
            default: -transaction__complete_date
            enum:
              - name
              - -name
              - transaction__amount
              - -transaction__amount
              - transaction__complete_date
              - -transaction__complete_date
        - name: recurring
          in: query
          schema:
            type: integer
            default: -1
            description: |
              filter recurring donations
              - 1: only recurring,
              - 0: exclude recurring,
              - -1: list all
            enum:
              - 1
              - 0
              - -1
        - name: donor_type
          in: query
          schema:
            type: string
            default: null
            description: |
              filter donations by donor_type
              - null: all
              - personal: only personal donations
              - corporate: only corporate donations
            enum:
              - null
              - personal
              - corporate
        - $ref: '#/components/parameters/Amount'
        - $ref: '#/components/parameters/AmountCondition'
        - $ref: '#/components/parameters/BinNumber'
        - $ref: '#/components/parameters/LastFour'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/StartPage'
        - $ref: '#/components/parameters/HowMany'
        - $ref: '#/components/parameters/PaymentMethod'
