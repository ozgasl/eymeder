    GenerateToken:
      description: Access token generated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token:
                description: Access token to be used
                type: string
              token_type:
                description: Access token type
                type: string
              expires_in:
                description: Number of seconds to token expiration
                type: number
              refresh_token:
                description: >-
                  Refresh token used to obtain a new access token. Valid for 30 days, on a
                  sliding window: each refresh returns a new refresh token and starts a
                  fresh 30 days, so the previous one stops working. Only returned for the
                  authorization_code grant.
                type: string
          example:
            access_token: access_token
            token_type: Bearer
            expires_in: 3600
            refresh_token: refresh_token
