      type: object
      properties:
        id:
          description: |
            timeline event id <br>
            Acquisition-lead rows (event_type 27) are not stored in the same table and
            carry a namespaced string id instead, in the form <code>lead-&lt;id&gt;</code>.
          oneOf:
