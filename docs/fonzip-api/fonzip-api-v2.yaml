openapi: 3.0.3
info:
  title: Fonzip API v2 Documents
  description: |
      ## This document includes the API v2 information for Fonzip
      
      To create an API key, you should navigate to **Settings > Advanced > Fonzip API** from the navigation menu and click **Create an API key**.

      If you want to develop an application that uses Fonzip API via Oauth v2, please contact with us.

      Fonzip API is limited to 240 requests per minute. Make sure to handle HTTP 429.

      If you receive HTTP error codes 520, 521 or 523 please contact us with IP addresses sending the request.
      
      Please contact with us in case of questions, requests or problems.
  version: '2.40.0'
  contact:
    name: Fonzip Support Team
    url: https://fonzip.com
    email: help@fonzip.com
  x-logo:
    url: https://s.fonzip.com/dist/public/img/logo/logo.svg
    altText: Fonzip API
servers:
  - url: https://fonzip.com/api/v2
    description: Fonzip API v2
paths:
  /token:
    post:
      tags: [Authentication]
      description: Returns token for access
      summary: Get Access Token
      operationId: getAccessToken
      requestBody:
        $ref: '#/components/requestBodies/GenerateToken'
      responses:
        200:
          $ref: '#/components/responses/GenerateToken'
        400:
          $ref: '#/components/responses/InvalidAuthorizationGrant'
        401:
          $ref: "#/components/responses/InvalidCredentials"
        402:
          $ref: "#/components/responses/InvalidGrant"
        405:
          $ref: "#/components/responses/InvalidRequestMethod"
        406:
          $ref: "#/components/responses/GrantTypeError"
        409:
          $ref: "#/components/responses/TokenAlreadyCreated"
        429:
          $ref: "#/components/responses/RateLimitExceeded"
        500:
          $ref: "#/components/responses/GenerateTokenFail"
  /authorize:
    get:
      tags: [Authentication]
      description: Returns the consent page for OAuth2 authorization.
      summary: OAuth2 Authorize (GET)
      operationId: oauthAuthorizeGet
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK - Consent page rendered
        302:
          description: Found - Redirect to login if not authenticated
  /me:
    get:
